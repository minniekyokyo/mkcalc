<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#120e0f"/><meta name="apple-mobile-web-app-capable" content="yes"/><title>[미쿄]팀파워계산기</title><link rel="manifest" href="manifest.webmanifest"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/><style>
:root{color-scheme:dark;--bg:#120e0f;--panel:#1c1618;--field:#251d20;--border:#35292d;--text:#f0ebec;--muted:#a99da1;--accent:#b94c56}
*{box-sizing:border-box;font-style:normal}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 Pretendard,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;font-style:normal}
.wrap{max-width:1120px;margin:auto;padding:0 24px}
header{border-bottom:1px solid var(--border)}
.head{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start;padding-top:26px;padding-bottom:25px}
.brand h1{font-size:25px;letter-spacing:-.035em;font-weight:650;margin:0 0 8px;line-height:1.25}
.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.notice{font-size:12px;line-height:1.62;color:var(--muted);white-space:pre-line;margin:0}
main{padding-top:24px!important;padding-bottom:40px!important}
.panel{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:22px;margin-bottom:14px}
h2{font-weight:650;font-size:16px;margin:0 0 18px;letter-spacing:-.02em}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.combo{position:relative}
input,select{background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:6px;min-width:0;width:100%;height:41px;padding:0 31px 0 11px;outline:none}
input:focus,select:focus{border-color:var(--accent)}input::placeholder{color:#8e8286}
.compare{display:flex;align-items:center;gap:12px}.compare label{font-size:13px;flex:0 0 67px}.compare .combo{flex:1;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{height:41px;padding:0 17px;border-radius:6px;border:1px solid var(--border);background:#282023;color:var(--text);cursor:pointer;white-space:nowrap;font-weight:550}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.45;cursor:default}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px} .title-row h2{margin:0}.title-row .meta{font-size:12px;color:var(--muted)}
.search{max-width:180px;height:36px}
.table-wrap{overflow:auto}.rank{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed}
.rank th,.rank td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rank thead{background:#2c2024}.rank th{font-weight:600;color:#ded4d7}
.rank tbody tr:nth-child(2n){background:#20191c}.rank tbody tr:nth-child(2n+1){background:#1a1517}
.rank th:nth-child(1){width:9%}.rank th:nth-child(2){width:57%}.rank th:nth-child(3){width:17%}.rank th:nth-child(4){width:17%}
.rank td:nth-child(1),.rank td:nth-child(3){font-weight:600}.pokemon-name{font-size:13px;font-weight:600;white-space:normal}.pokemon-moves{font-size:11px;color:var(--muted);margin-top:3px;white-space:normal;overflow-wrap:anywhere;line-height:1.35}.rank td:nth-child(2){text-align:left;padding-left:14px}.empty{padding:32px 12px!important;color:var(--muted)}
.footer{font-size:11px;color:#776c70;padding:12px 0}
@media(max-width:900px){.head{grid-template-columns:1fr;gap:16px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.rank th,.rank td{padding:10px 5px;font-size:12px}.rank th:nth-child(1){width:12%}.rank th:nth-child(2){width:50%}.rank th:nth-child(3){width:19%}.rank th:nth-child(4){width:19%}.rank td:nth-child(2){padding-left:8px}.pokemon-name{font-size:12px}.pokemon-moves{font-size:10px}.wrap{padding-left:14px;padding-right:14px}.head{padding-top:20px;padding-bottom:18px}.brand h1{font-size:22px}.panel{padding:14px}.fields{gap:12px}.compare{align-items:stretch;flex-wrap:wrap}.compare label{flex-basis:100%;padding-top:0}.compare .combo{flex-basis:100%}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.search{max-width:148px}}
</style></head><body>
<header><div class="wrap head"><div class="brand"><h1>[미쿄]팀파워계산기</h1><span id="status" class="status" role="status" aria-live="polite">연결 대기</span></div><p class="notice">▶ 일부 미구현 개체 포함되어 있을 수 있습니다.
▶ 개인 참고용 계산기로 Gamepress기반 DPS 계산과는 차이가 있습니다.
   - 1차징 스킬 패널티 미적용
   - 피해를 입어 얻은 에너지 및 실신으로 낭비되는 에너지 미반영
※ 특히 유리대포(레지드래고/그림자라이코 등) 티어는 타 자료와의 차이에 유의하세요.</p></div></header>
<main class="wrap">
<section class="panel"><h2>계산조건</h2><div class="fields"><div class="field"><label for="boss">레이드 보스</label><div class="combo"><select id="boss" aria-label="boss"></select></div></div><div class="field"><label for="weather">날씨</label><div class="combo"><select id="weather" aria-label="weather"></select></div></div><div class="field"><label for="mega">진화(원시/메가)</label><div class="combo"><select id="mega" aria-label="mega"></select></div></div><div class="field"><label for="friend">우정 보너스</label><div class="combo"><select id="friend" aria-label="friend"></select></div></div><div class="field"><label for="sword">거수참</label><div class="combo"><select id="sword" aria-label="sword"></select></div></div><div class="field"><label for="team">팀 인원</label><div class="combo"><select id="team" aria-label="team"></select></div></div><div class="field"><label for="max">슈퍼맥스</label><div class="combo"><select id="max" aria-label="max"></select></div></div></div></section>
<section class="panel"><div class="compare"><label for="maxPokemon">비교대상</label><div class="combo"><select id="maxPokemon" aria-label="maxPokemon"></select></div><div class="actions"><button id="reset">초기화</button><button id="calculate" class="primary" disabled>계산</button></div></div></section>
<section class="panel"><div class="title-row"><div><h2>DPS순위</h2><span id="count" class="meta">TOP 20</span></div><input id="search" type="search" class="search" placeholder="검색" aria-label="포켓몬 검색"/></div><div class="table-wrap"><table class="rank"><thead><tr><th>순위</th><th>개체</th><th>DPS</th><th>비교</th></tr></thead><tbody id="results"><tr><td class="empty" colspan="4">데이터 연결 중</td></tr></tbody></table></div></section>
<div class="footer">비공식 참고용 계산기 · 데이터 새로고침은 페이지 새로고침으로 가능합니다.</div>
</main><script src="config.js"></script><script>
'use strict';
const $ = id => document.getElementById(id);
const ids = ['boss','weather','mega','friend','sword','team','max'];
const allIds = [...ids,'maxPokemon'];
const DEFAULTS = Object.freeze({weather:'날씨없음',mega:'메진없음',friend:'일반',sword:'일반',max:'슈퍼맥스'});
function applyDefaults(){
 for(const id of allIds){const select=$(id);const value=DEFAULTS[id] || '';select.value=[...select.options].some(option=>option.value===value)?value:'';}
}
let data, ranks=[], loadBusy=false;
const n = x => { if (typeof x==='number') return x; if(x==null || x==='')return NaN;const t=String(x).replace(/[(),\s]/g,'');return Number(t);};
const lookupTable=(table,key,column)=>{
 const header=(table[0]||[]).map(String), idx=header.indexOf(String(column));
 if(idx<0)return NaN;
 const row=table.slice(1).find(r=>String(r[0])===String(key));
 return row?n(row[idx]):NaN;
};
const moveKey = value => String(value ?? '').trim().toLocaleLowerCase('en-US');
const dedup = arr => Array.from(new Set(arr.map(String).filter(Boolean)));
function populate(id,options){
 const items=dedup(options), select=$(id);
 select.replaceChildren();
 const empty=document.createElement('option');empty.value='';empty.textContent='선택';select.append(empty);
 for(const val of items){const option=document.createElement('option');option.value=val;option.textContent=val;select.append(option);}
 select.value='';
}
function initOptions(){
 populate('boss',data.bosses);
 populate('weather',data.weather.slice(1).map(r=>r[0]));
 populate('mega',data.mega.slice(1).map(r=>r[0]));
 populate('friend',['베프','일반']);
 populate('sword',['거수참','일반']);
 populate('team',[1,2,3,4]);
 populate('max',['슈퍼맥스','하이레벨']);
 populate('maxPokemon',data.pokemon.map(p=>p[0]));
 applyDefaults();
 $('calculate').disabled=false;
 clearResults('레이드 보스와 팀 인원을 선택한 뒤 계산 버튼을 눌러 주세요.');
}
function computeRow(p,boss,settings,movesByName,bossByName,cpByLevel) {
 const name=String(p[0]), type1=String(p[1]||''),type2=String(p[2]||'');
 const level=n(p[3]),attack=n(p[4]),fast=String(p[9]||''),fastType=String(p[10]||''),charged=String(p[14]||''),chargedType=String(p[15]||'');
 const moveF=movesByName.get(moveKey(fast)),moveC=movesByName.get(moveKey(charged));
 const fpower=moveF?n(moveF[1]):NaN, fenergy=moveF?n(moveF[2]):NaN, ftime=moveF?n(moveF[3]):NaN;
 const cpower=(moveC?n(moveC[1]):NaN) * (p[19]===1 || String(p[19])==='1' ? (settings.max==='슈퍼맥스'?1.3:1.2):1);
 const cenergy=moveC?Math.abs(n(moveC[2])):NaN,ctime=moveC?n(moveC[3]):NaN;
 const bossRow=bossByName.get(boss),defense=bossRow?n(bossRow[1]):NaN;
 const cp=cpByLevel.get(String(level));const atk=Number.isFinite(cp)?attack*cp:NaN;
 if(!Number.isFinite(fpower*cpower*fenergy*cenergy*ftime*ctime*atk*defense) || fenergy<=0 || cenergy<=0 || ftime<=0 || ctime<=0)return null;
 const fastN=cenergy/fenergy, period=fastN*ftime+ctime;
 const shadow=name.includes('그림자')?1.2:1;
 const common=shadow*(settings.sword==='거수참'?1.2:1)*(settings.friend==='베프'?1.1:1);
 const teamCount=Number(settings.team);
 const maxFast=teamCount>1?360/(20*(teamCount-1)):Infinity;
 const teamBuff=teamCount>1?Math.min(fastN,maxFast)/maxFast:0;
 const w=teamBuff;
 const calcDamage=(power,moveType)=>{
   const stab=(moveType===type1 || moveType===type2)?1.2:1;
   const weather=lookupTable(data.weather,settings.weather,moveType);
   const mega=lookupTable(data.mega,settings.mega,moveType);
   const e1=lookupTable(data.effectiveness,moveType,bossRow&&bossRow[3]);
   const e2=bossRow&&bossRow[4]?lookupTable(data.effectiveness,moveType,bossRow[4]):1;
   const multiplier=stab*common*weather*mega*e1*e2;
   if(!Number.isFinite(multiplier))return NaN;
   return Math.floor(0.5*power*atk/((defense+15)*0.7903)*multiplier)+1;
 };
 const fd=calcDamage(fpower,fastType),cd=calcDamage(cpower*(1+w),chargedType);
 if(!Number.isFinite(fd+cd) || period<=0)return null;
 return {name,fast,charged,dps:(fd*fastN+cd)/period};
}
function calculate(){
 if(!data)return;
 const settings=Object.fromEntries(allIds.map(id=>[id,$(id).value.trim()]));
 const missing=ids.filter(id=>!settings[id]);
 if(missing.length){
   clearResults('계산조건을 모두 선택해 주세요.');
   $('status').textContent='조건 선택 필요';
   $(missing[0]).focus();return;
 }
 const bossByName=new Map(data.raidBosses.map(row=>[String(row[0]),row]));
 const movesByName=new Map();
 // Google Sheets MATCH는 대소문자를 구분하지 않고 첫 번째 일치 행을 사용합니다.
 for(const row of data.moves){
   const key=moveKey(row[0]);
   if(key && !movesByName.has(key)) movesByName.set(key,row);
 }
 const cpByLevel=new Map(data.cp.map(row=>[String(n(row[0])),n(row[1])]));
 const list=[];let skipped=0;
 const missingNames=[];
 for(const row of data.pokemon){
   const val=computeRow(row,settings.boss,settings,movesByName,bossByName,cpByLevel);
   if(val&&Number.isFinite(val.dps)) list.push(val);
   else {skipped++;missingNames.push(String(row[0]));}
 }
 const reference=settings.maxPokemon?list.find(x=>x.name===settings.maxPokemon):null;
 const base=reference?.dps||NaN;
 ranks=list.sort((a,b)=>b.dps-a.dps).slice(0,20).map(x=>({...x,relative:Number.isFinite(base)&&base>0?100*x.dps/base:NaN}));
 $('status').textContent='계산 완료';
 render();
 if(skipped)console.warn('계산 불가 조합('+skipped+'개):',missingNames.join(', '));
}
function clearResults(message){
 ranks=[];$('count').textContent='TOP 20';const root=$('results');root.replaceChildren();
 const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.className='empty';td.textContent=message;tr.append(td);root.append(tr);
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const rows=ranks.filter(x=>(x.name+' '+x.fast+' '+x.charged).toLowerCase().includes(q));
 $('count').textContent=rows.length+' / 20';
 const root=$('results');root.replaceChildren();
 if(!rows.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.className='empty';td.textContent='검색 결과가 없습니다.';tr.append(td);root.append(tr);return;}
 for(const x of rows){
   const tr=document.createElement('tr');
   const rank=document.createElement('td');rank.textContent=String(ranks.indexOf(x)+1);tr.append(rank);
   const pokemon=document.createElement('td');
   const name=document.createElement('div');name.className='pokemon-name';name.textContent=x.name;
   const moves=document.createElement('div');moves.className='pokemon-moves';moves.textContent=x.fast+' / '+x.charged;
   pokemon.append(name,moves);tr.append(pokemon);
   const dps=document.createElement('td');dps.textContent=x.dps.toFixed(2);tr.append(dps);
   const compare=document.createElement('td');compare.textContent=Number.isFinite(x.relative)?x.relative.toFixed(1)+'%':'—';tr.append(compare);
   root.append(tr);
 }
}
function load(){
 if(loadBusy)return;loadBusy=true;$('calculate').disabled=true;$('status').textContent='데이터 불러오는 중';
 const url=String(window.PP_API_URL||'');
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url)){$('status').textContent='API 연결 설정 필요';clearResults('config.js 파일에 배포된 Apps Script 웹앱 URL을 입력하세요.');loadBusy=false;return;}
 const cb='ppCalcCallback'+Date.now();let done=false;const script=document.createElement('script');const timeout=setTimeout(()=>finish(new Error('연결 시간 초과')),20000);
 function finish(err,payload){if(done)return;done=true;clearTimeout(timeout);delete window[cb];script.remove();loadBusy=false;if(err||payload?.error){$('status').textContent='연결 오류';clearResults(err?.message||payload.error);return;}data=payload;initOptions();}
 window[cb]=payload=>finish(null,payload);
 script.onerror=()=>finish(new Error('API 연결 실패: 배포 권한 또는 URL을 확인하세요.'));
 script.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.append(script);
}
function resetAll(){applyDefaults();$('search').value='';clearResults('레이드 보스와 팀 인원을 선택한 뒤 계산 버튼을 눌러 주세요.');$('status').textContent='조건 선택 대기';}
$('calculate').addEventListener('click',calculate);

$('search').addEventListener('input',render);
$('reset').addEventListener('click',resetAll);
for(const id of allIds)$(id).addEventListener('change',()=>{$('status').textContent='조건 변경됨';clearResults('계산 버튼을 누르면 결과가 표시됩니다.');});
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();
</script></body></html>
